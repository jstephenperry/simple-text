name: Release MSIX

# Releases are cut by running this workflow (Actions tab -> Run workflow, on the commit/branch to
# release), NOT by pushing a hand-made tag: the released version is version.txt + an auto-incrementing
# build number (the workflow run number), which isn't known until the run starts. The workflow stamps
# that full 4-part version into the MSIX manifest and the Velopack package, then publishes the GitHub
# Release tagged with it. App-reported version == git tag == MSIX Identity == Velopack package, so both
# in-app updaters (WinUI tag comparison; Avalonia/Velopack package comparison) detect updates correctly.
on:
  workflow_dispatch:

permissions:
  contents: write       # create the release tag, the GitHub Release, and upload assets

concurrency:
  group: release        # serialize releases so build-number-derived versions stay strictly increasing
  cancel-in-progress: false

jobs:
  assets:
    name: Generate visual assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rasterizers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick
      - run: ./build/generate-winui-assets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: winui-images
          path: SimpleText.WinUI/Images/
          if-no-files-found: error

  build:
    name: Build + sign MSIX
    needs: assets
    runs-on: windows-latest
    env:
      Project: SimpleText.WinUI/SimpleText.WinUI.csproj
      PackageDir: ${{ github.workspace }}\AppPackages
      BuildNumber: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # The full release version is version.txt + the auto-incrementing build number, and the release
      # tag mirrors it (vX.Y.Z.<build>). Stamp it into the MSIX manifest's 4-part Identity so the
      # packaged version, the git tag, and the app's reported version all agree (drives WinUI updates).
      - name: Compute & stamp build version
        shell: bash
        run: |
          ver="$(tr -d '[:space:]' < version.txt)"
          full="${ver}.${BuildNumber}"
          echo "FULL_VERSION=$full" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$full" >> "$GITHUB_ENV"
          ./build/set-build-version.sh "$BuildNumber"

      - name: Download generated assets
        uses: actions/download-artifact@v4
        with:
          name: winui-images
          path: SimpleText.WinUI/Images

      - name: Restore (x64, ARM64)
        run: |
          dotnet restore "${{ env.Project }}" -p:Platform=x64
          dotnet restore "${{ env.Project }}" -p:Platform=ARM64

      # Build both architectures with one certificate so a single trust covers them.
      # Uses the provided code-signing cert if SIGNING_CERTIFICATE_BASE64 is set;
      # otherwise generates a self-signed test cert (CN must match the manifest Publisher)
      # so the package is always signed. For Store submission, sign disabled + .msixupload.
      - name: Build + sign
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          PFX_PWD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.PackageDir }}" | Out-Null
          $pfx = "$env:RUNNER_TEMP\sign.pfx"
          if ($env:PFX_B64) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
            $pw = $env:PFX_PWD
            $cert = Get-PfxCertificate -FilePath $pfx -Password (ConvertTo-SecureString $pw -AsPlainText -Force)
            Write-Host "Signing with the provided code-signing certificate."
          } else {
            $pw = [guid]::NewGuid().ToString('N')
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=SimpleText" `
              -FriendlyName "SimpleText CI (self-signed)" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -NotAfter (Get-Date).AddYears(5)
            $sec = ConvertTo-SecureString -String $pw -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $sec | Out-Null
            Write-Warning "No SIGNING_CERTIFICATE_BASE64 secret set; used a self-signed certificate. Users must trust SimpleText.cer (build/trust-cert.ps1) before installing."
          }

          # Ship the public cert so users can trust the publisher (build/trust-cert.ps1).
          Export-Certificate -Cert $cert -FilePath "${{ env.PackageDir }}\SimpleText.cer" | Out-Null

          foreach ($p in @('x64','ARM64')) {
            msbuild "${{ env.Project }}" `
              /p:Configuration=Release `
              /p:Platform=$p `
              /p:BuildNumber=${{ env.BuildNumber }} `
              /p:GenerateAppxPackageOnBuild=true `
              /p:AppxPackageDir="${{ env.PackageDir }}\" `
              /p:UapAppxPackageBuildMode=SideloadOnly `
              /p:AppxBundle=Never `
              /p:AppxPackageSigningEnabled=true `
              /p:PackageCertificateKeyFile="$pfx" `
              /p:PackageCertificatePassword="$pw"
          }

      - name: Collect release files
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\release"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem -Recurse "${{ env.PackageDir }}" -Include *.msix,*.cer |
            ForEach-Object { Copy-Item $_.FullName -Destination $dest }
          Get-ChildItem $dest

      # Create the release tag (vX.Y.Z.<build>) at the current commit and publish the Release with the
      # MSIX assets. action-gh-release creates the tag if it doesn't exist; pack-avalonia then appends
      # its installers to this same tag's release.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: ${{ runner.temp }}/release/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Cross-platform Avalonia installers + in-app auto-update feed, built with Velopack and
  # attached to the same GitHub Release. Each OS packs its own channel (win/osx/linux) that
  # the app's UpdateManager reads; the release object is created first by the MSIX `build`
  # job (so notes exist), and these jobs append their assets.
  pack-avalonia:
    name: Pack Avalonia (${{ matrix.rid }})
    needs: build
    env:
      BuildNumber: ${{ github.run_number }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            mainExe: SimpleText.Avalonia.exe
          - os: macos-latest
            rid: osx-arm64
            mainExe: SimpleText.Avalonia
          - os: ubuntu-latest
            rid: linux-x64
            mainExe: SimpleText.Avalonia
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Velopack's Linux AppImage build shells out to mksquashfs.
      - name: Install Linux packaging dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools

      - name: Install Velopack CLI
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Pack the same full version the MSIX build/tag use: version.txt + the auto-incrementing build
      # number. Velopack compares package versions from the feed to decide updates, so this 4th
      # component makes every release strictly newer than the last (even without a version.txt bump),
      # which is exactly what the Avalonia in-app updater needs.
      - name: Read version
        shell: bash
        run: |
          ver="$(tr -d '[:space:]' < version.txt)"
          full="${ver}.${BuildNumber}"
          echo "VPK_VERSION=$full" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$full" >> "$GITHUB_ENV"
          echo "Packing Velopack version $full (version.txt $ver + build $BuildNumber)"

      - name: Publish (self-contained)
        shell: bash
        run: >
          dotnet publish SimpleText.Avalonia/SimpleText.Avalonia.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=$VPK_VERSION -p:BuildNumber=$BuildNumber -o publish

      - name: Pack with Velopack
        shell: bash
        run: >
          vpk pack
          -u SimpleText.Avalonia
          -v $VPK_VERSION
          -p publish
          -e ${{ matrix.mainExe }}
          -r ${{ matrix.rid }}
          -o vpk-release
          --packTitle "SimpleText"
          --packAuthors "jstephenperry"
          --delta None

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: vpk-release/*
          fail_on_unmatched_files: true
