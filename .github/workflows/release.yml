name: Release MSIX

# Releases are cut by running this workflow (Actions tab -> Run workflow, on the commit/branch to
# release), NOT by pushing a hand-made tag: the released version is version.txt + an auto-incrementing
# build number (the workflow run number), which isn't known until the run starts. The workflow stamps
# that full 4-part version into the MSIX manifest and the Velopack package, then publishes the GitHub
# Release tagged with it. App-reported version == git tag == MSIX Identity == Velopack package, so both
# in-app updaters (WinUI tag comparison; Avalonia/Velopack package comparison) detect updates correctly.
on:
  workflow_dispatch:

permissions:
  contents: write       # create the release tag, the GitHub Release, and upload assets
  id-token: write       # OIDC token for azure/login (Azure Artifact Signing); harmless for other jobs

concurrency:
  group: release        # serialize releases so build-number-derived versions stay strictly increasing
  cancel-in-progress: false

jobs:
  assets:
    name: Generate visual assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rasterizers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick
      - run: ./build/generate-winui-assets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: winui-images
          path: SimpleText.WinUI/Images/
          if-no-files-found: error

  build:
    name: Build + sign MSIX
    needs: assets
    runs-on: windows-latest
    env:
      Project: SimpleText.WinUI/SimpleText.WinUI.csproj
      PackageDir: ${{ github.workspace }}\AppPackages
      BuildNumber: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # The full release version is version.txt + the auto-incrementing build number, and the release
      # tag mirrors it (vX.Y.Z.<build>). Stamp it into the MSIX manifest's 4-part Identity so the
      # packaged version, the git tag, and the app's reported version all agree (drives WinUI updates).
      - name: Compute & stamp build version
        shell: bash
        run: |
          ver="$(tr -d '[:space:]' < version.txt)"
          full="${ver}.${BuildNumber}"
          echo "FULL_VERSION=$full" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$full" >> "$GITHUB_ENV"
          ./build/set-build-version.sh "$BuildNumber"

      # MSIX identity is baked in at PACK time, and Windows requires the manifest <Identity Publisher>
      # to EXACTLY equal the signing certificate's subject DN (same RDNs, same order, case-sensitive) —
      # a mismatch fails signing/install with 0x8007000B. So stamp the real Azure Artifact Signing
      # subject (from the ARTIFACT_SIGNING_PUBLISHER secret) into the manifest BEFORE building. The
      # committed manifest keeps the generic CN=SimpleText for local self-signed sideload; this only
      # rewrites it for the signed release build. Read the exact subject from your certificate profile
      # in the Azure portal (Certificate profiles → <profile> → Subject name). See docs/msix-packaging.md.
      #
      # NOTE: Publisher is the app's update identity (Name + Publisher → PublisherId → PackageFamilyName).
      # Once you ship a release on a given subject, keep it FROZEN — changing it later makes Windows treat
      # the package as a different app, breaking in-place auto-update for existing installs.
      - name: Stamp MSIX publisher (must equal the signing cert subject)
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ secrets.ARTIFACT_SIGNING_PUBLISHER }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSIX_PUBLISHER)) {
            Write-Error "ARTIFACT_SIGNING_PUBLISHER secret is not set. Releases must be signed by Azure Artifact Signing; set this secret to the EXACT certificate subject DN from your certificate profile (e.g. 'CN=Your Org, O=Your Org, L=City, S=State, C=US'). See docs/msix-packaging.md."
            exit 1
          }
          $manifest = (Resolve-Path "SimpleText.WinUI/Package.appxmanifest").Path
          $doc = New-Object System.Xml.XmlDocument
          $doc.PreserveWhitespace = $true            # keep the manifest formatting otherwise intact
          $doc.Load($manifest)
          $doc.Package.Identity.Publisher = $env:MSIX_PUBLISHER
          $doc.Save($manifest)
          Write-Host "Stamped MSIX Identity Publisher = $($doc.Package.Identity.Publisher)"

      - name: Download generated assets
        uses: actions/download-artifact@v4
        with:
          name: winui-images
          path: SimpleText.WinUI/Images

      - name: Restore (x64, ARM64)
        run: |
          dotnet restore "${{ env.Project }}" -p:Platform=x64
          dotnet restore "${{ env.Project }}" -p:Platform=ARM64

      # Build both architectures UNSIGNED. Azure Artifact Signing applies the only signature later
      # (the "Sign MSIX" step below), so msbuild must NOT sign here: AppxPackageSigningEnabled=false
      # and no PackageCertificate* properties. For Store submission instead, use
      # UapAppxPackageBuildMode=StoreUpload with signing disabled and upload the .msixupload.
      - name: Build MSIX (unsigned, x64 + ARM64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.PackageDir }}" | Out-Null
          foreach ($p in @('x64','ARM64')) {
            msbuild "${{ env.Project }}" `
              /p:Configuration=Release `
              /p:Platform=$p `
              /p:BuildNumber=${{ env.BuildNumber }} `
              /p:GenerateAppxPackageOnBuild=true `
              /p:AppxPackageDir="${{ env.PackageDir }}\" `
              /p:UapAppxPackageBuildMode=SideloadOnly `
              /p:AppxBundle=Never `
              /p:AppxPackageSigningEnabled=false
          }

      - name: Collect release files
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\release"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem -Recurse "${{ env.PackageDir }}" -Include *.msix |
            ForEach-Object { Copy-Item $_.FullName -Destination $dest }
          Get-ChildItem $dest

      # Sign the produced .msix files with Azure Artifact Signing (formerly "Trusted Signing").
      # Its certificate chains to a Microsoft public root that is trusted out of the box, so the
      # signed package installs with no per-machine trust step and the in-app WinUI updater's silent
      # PackageManager.AddPackageByUriAsync staging path works on any machine. Auth is OIDC: this
      # azure/login step exchanges the workflow's id-token (see permissions above) for Azure creds
      # that the signing action reads via DefaultAzureCredential. The app registration needs a GitHub
      # federated credential and the "Artifact Signing Certificate Profile Signer" role on the profile.
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Action renamed from azure/trusted-signing-action when the service was rebranded "Artifact
      # Signing" (early 2026); pin @v2. Certs are valid ~3 days, so RFC3161 timestamping is mandatory
      # (defaults shown explicitly). `endpoint` MUST match the region of your account/profile, or
      # signing fails with 403. Verify input names against the action README for the tag you pin.
      - name: Sign MSIX (Azure Artifact Signing)
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ runner.temp }}\release
          files-folder-filter: msix
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Create the release tag (vX.Y.Z.<build>) at the current commit and publish the Release with the
      # signed MSIX assets. action-gh-release creates the tag if it doesn't exist; pack-avalonia then
      # appends its installers to this same tag's release.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: ${{ runner.temp }}/release/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Avalonia installers + in-app auto-update feed, built with Velopack and attached to the same
  # GitHub Release. Each OS packs its own channel (win/linux) that the app's UpdateManager reads;
  # the release object is created first by the MSIX `build` job (so notes exist), and these jobs
  # append their assets.
  #
  # macOS is intentionally excluded: Velopack updates on macOS require an Apple Developer ID
  # signature + notarization (Gatekeeper quarantines unsigned downloaded updates and refuses to
  # launch them), which this project doesn't set up. Shipping an unsigned osx channel would be a
  # broken auto-updater, so mac users build from source. See docs/msix-packaging.md / README.
  pack-avalonia:
    name: Pack Avalonia (${{ matrix.rid }})
    needs: build
    env:
      BuildNumber: ${{ github.run_number }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            mainExe: SimpleText.Avalonia.exe
          - os: ubuntu-latest
            rid: linux-x64
            mainExe: SimpleText.Avalonia
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Velopack's Linux AppImage build shells out to mksquashfs.
      - name: Install Linux packaging dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools

      - name: Install Velopack CLI
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Pack the same full version the MSIX build/tag use: version.txt + the auto-incrementing build
      # number. Velopack compares package versions from the feed to decide updates, so this 4th
      # component makes every release strictly newer than the last (even without a version.txt bump),
      # which is exactly what the Avalonia in-app updater needs.
      - name: Read version
        shell: bash
        run: |
          ver="$(tr -d '[:space:]' < version.txt)"
          full="${ver}.${BuildNumber}"
          echo "VPK_VERSION=$full" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$full" >> "$GITHUB_ENV"
          echo "Packing Velopack version $full (version.txt $ver + build $BuildNumber)"

      - name: Publish (self-contained)
        shell: bash
        run: >
          dotnet publish SimpleText.Avalonia/SimpleText.Avalonia.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=$VPK_VERSION -p:BuildNumber=$BuildNumber -o publish

      - name: Pack with Velopack
        shell: bash
        run: >
          vpk pack
          -u SimpleText.Avalonia
          -v $VPK_VERSION
          -p publish
          -e ${{ matrix.mainExe }}
          -r ${{ matrix.rid }}
          -o vpk-release
          --packTitle "SimpleText"
          --packAuthors "jstephenperry"
          --delta None

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: vpk-release/*
          fail_on_unmatched_files: true
