name: Release MSIX

on:
  push:
    tags: ['v*']        # e.g. v1.0.0
  workflow_dispatch:

permissions:
  contents: write       # create the GitHub Release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assets:
    name: Generate visual assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rasterizers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick
      - run: ./build/generate-winui-assets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: winui-images
          path: SimpleText.WinUI/Images/
          if-no-files-found: error

  build:
    name: Build + sign MSIX
    needs: assets
    runs-on: windows-latest
    env:
      Project: SimpleText.WinUI/SimpleText.WinUI.csproj
      PackageDir: ${{ github.workspace }}\AppPackages
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Download generated assets
        uses: actions/download-artifact@v4
        with:
          name: winui-images
          path: SimpleText.WinUI/Images

      - name: Restore (x64, ARM64)
        run: |
          dotnet restore "${{ env.Project }}" -p:Platform=x64
          dotnet restore "${{ env.Project }}" -p:Platform=ARM64

      # Build both architectures with one certificate so a single trust covers them.
      # Uses the provided code-signing cert if SIGNING_CERTIFICATE_BASE64 is set;
      # otherwise generates a self-signed test cert (CN must match the manifest Publisher)
      # so the package is always signed. For Store submission, sign disabled + .msixupload.
      - name: Build + sign
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          PFX_PWD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.PackageDir }}" | Out-Null
          $pfx = "$env:RUNNER_TEMP\sign.pfx"
          if ($env:PFX_B64) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
            $pw = $env:PFX_PWD
            $cert = Get-PfxCertificate -FilePath $pfx -Password (ConvertTo-SecureString $pw -AsPlainText -Force)
            Write-Host "Signing with the provided code-signing certificate."
          } else {
            $pw = [guid]::NewGuid().ToString('N')
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=SimpleText" `
              -FriendlyName "SimpleText CI (self-signed)" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -NotAfter (Get-Date).AddYears(5)
            $sec = ConvertTo-SecureString -String $pw -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $sec | Out-Null
            Write-Warning "No SIGNING_CERTIFICATE_BASE64 secret set; used a self-signed certificate. Users must trust SimpleText.cer (build/trust-cert.ps1) before installing."
          }

          # Ship the public cert so users can trust the publisher (build/trust-cert.ps1).
          Export-Certificate -Cert $cert -FilePath "${{ env.PackageDir }}\SimpleText.cer" | Out-Null

          foreach ($p in @('x64','ARM64')) {
            msbuild "${{ env.Project }}" `
              /p:Configuration=Release `
              /p:Platform=$p `
              /p:GenerateAppxPackageOnBuild=true `
              /p:AppxPackageDir="${{ env.PackageDir }}\" `
              /p:UapAppxPackageBuildMode=SideloadOnly `
              /p:AppxBundle=Never `
              /p:AppxPackageSigningEnabled=true `
              /p:PackageCertificateKeyFile="$pfx" `
              /p:PackageCertificatePassword="$pw"
          }

      - name: Collect release files
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\release"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem -Recurse "${{ env.PackageDir }}" -Include *.msix,*.cer |
            ForEach-Object { Copy-Item $_.FullName -Destination $dest }
          Get-ChildItem $dest

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/release/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Cross-platform Avalonia installers + in-app auto-update feed, built with Velopack and
  # attached to the same GitHub Release. Each OS packs its own channel (win/osx/linux) that
  # the app's UpdateManager reads; the release object is created first by the MSIX `build`
  # job (so notes exist), and these jobs append their assets. Tags only.
  pack-avalonia:
    name: Pack Avalonia (${{ matrix.rid }})
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            mainExe: SimpleText.Avalonia.exe
          - os: macos-latest
            rid: osx-arm64
            mainExe: SimpleText.Avalonia
          - os: ubuntu-latest
            rid: linux-x64
            mainExe: SimpleText.Avalonia
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Velopack's Linux AppImage build shells out to mksquashfs.
      - name: Install Linux packaging dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools

      - name: Install Velopack CLI
        shell: bash
        run: |
          dotnet tool install -g vpk --version 1.2.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # version.txt (3-part SemVer) is the single source of truth; Velopack uses it directly.
      # The git tag is just the release trigger (the MSIX manifest carries the 4-part version.txt + ".0").
      - name: Read version
        shell: bash
        run: |
          ver="$(tr -d '[:space:]' < version.txt)"
          echo "VPK_VERSION=$ver" >> "$GITHUB_ENV"
          echo "Packing Velopack version $ver (from version.txt; tag $GITHUB_REF_NAME)"

      - name: Publish (self-contained)
        shell: bash
        run: >
          dotnet publish SimpleText.Avalonia/SimpleText.Avalonia.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=$VPK_VERSION -o publish

      - name: Pack with Velopack
        shell: bash
        run: >
          vpk pack
          -u SimpleText.Avalonia
          -v $VPK_VERSION
          -p publish
          -e ${{ matrix.mainExe }}
          -r ${{ matrix.rid }}
          -o vpk-release
          --packTitle "SimpleText"
          --packAuthors "jstephenperry"
          --delta None

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vpk-release/*
          fail_on_unmatched_files: true
