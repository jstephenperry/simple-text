name: CI

on:
  pull_request:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Guard the single-source version: the WinUI MSIX manifest must stay in sync with version.txt
  # (4-part = version.txt + ".0"). Catches a hand-edited version that skipped build/bump-version.sh.
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          ver="$(tr -d '[:space:]' < version.txt)"
          man="$(grep -oE '^[[:space:]]*Version="[0-9.]+"' SimpleText.WinUI/Package.appxmanifest | grep -oE '[0-9.]+' | head -1)"
          echo "version.txt=$ver  MSIX manifest=$man  (expected ${ver}.0)"
          if [ "$man" != "${ver}.0" ]; then
            echo "::error::MSIX manifest version ($man) != version.txt (${ver}.0). Run build/bump-version.sh to sync." >&2
            exit 1
          fi

  # Fast, cross-platform sanity check of the shared core (where most logic lives) plus its
  # unit tests. BuildNumber (the auto-incrementing 4th version component) is the workflow run
  # number, so the built assemblies carry a unique, increasing build version.
  core:
    name: Build & test core
    runs-on: ubuntu-latest
    env:
      BuildNumber: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build SimpleText.Core/SimpleText.Core.csproj -c Release -p:BuildNumber=$BuildNumber
      - run: dotnet test SimpleText.Core.Tests/SimpleText.Core.Tests.csproj -c Release -p:BuildNumber=$BuildNumber

  # Compile-check the cross-platform Avalonia frontend. It targets net10.0 and builds
  # headlessly on Linux (no display, MSIX, or Windows tooling needed), so a plain build
  # is enough to catch breakage in the frontend and its shared-core usage.
  avalonia:
    name: Build Avalonia
    runs-on: ubuntu-latest
    env:
      BuildNumber: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build SimpleText.Avalonia/SimpleText.Avalonia.csproj -c Release -p:BuildNumber=$BuildNumber

  # Render the MSIX visual assets from the brand SVG (reliable tooling on Linux).
  assets:
    name: Generate visual assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rasterizers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick
      - run: ./build/generate-winui-assets.sh
      - uses: actions/upload-artifact@v4
        with:
          name: winui-images
          path: SimpleText.WinUI/Images/
          if-no-files-found: error

  # The real verification: build the packaged MSIX (unsigned) on Windows.
  build-msix:
    name: Build MSIX (${{ matrix.platform }})
    needs: assets
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    env:
      Project: SimpleText.WinUI/SimpleText.WinUI.csproj
      PackageDir: ${{ github.workspace }}\AppPackages
      BuildNumber: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      # Stamp the auto-incrementing build number into the MSIX manifest's 4-part Identity version
      # (version.txt + "." + run number) so each packaged build is uniquely and increasingly versioned.
      - name: Stamp build version
        shell: bash
        run: ./build/set-build-version.sh "$BuildNumber"

      - name: Download generated assets
        uses: actions/download-artifact@v4
        with:
          name: winui-images
          path: SimpleText.WinUI/Images

      - name: Restore
        run: dotnet restore "${{ env.Project }}" -p:Platform=${{ matrix.platform }}

      - name: Build MSIX (unsigned)
        shell: pwsh
        run: |
          msbuild "${{ env.Project }}" `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:BuildNumber=${{ env.BuildNumber }} `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxPackageDir="${{ env.PackageDir }}\" `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=false

      - name: Upload unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: msix-unsigned-${{ matrix.platform }}
          path: ${{ env.PackageDir }}/**/*.msix
          if-no-files-found: error
