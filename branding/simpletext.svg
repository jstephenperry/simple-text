<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E86E0"/>
      <stop offset="1" stop-color="#0A4FA0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Brand tile -->
  <rect x="80" y="80" width="864" height="864" rx="196" fill="url(#tile)"/>
  <rect x="80" y="80" width="864" height="864" rx="196" fill="url(#sheen)"/>

  <!-- Document page with a folded top-right corner -->
  <path d="M 268 208
           L 636 208
           L 768 340
           L 768 794
           Q 768 816 746 816
           L 268 816
           Q 246 816 246 794
           L 246 230
           Q 246 208 268 208 Z"
        fill="#FCFDFF"/>
  <!-- Folded corner (back of the paper) -->
  <path d="M 636 208 L 768 340 L 636 340 Z" fill="#D3E0EF"/>

  <!-- Heading bar (accent) -->
  <rect x="320" y="356" width="232" height="48" rx="24" fill="#F2A63C"/>

  <!-- Body text lines (ragged right, like real text) -->
  <g fill="#A6B6C8">
    <rect x="320" y="456" width="376" height="32" rx="16"/>
    <rect x="320" y="528" width="376" height="32" rx="16"/>
    <rect x="320" y="600" width="300" height="32" rx="16"/>
    <rect x="320" y="672" width="376" height="32" rx="16"/>
  </g>

  <!-- Editing caret at the end of the third line -->
  <rect x="640" y="592" width="18" height="48" rx="9" fill="#F2A63C"/>
</svg>
